name: sae
extractor:
  _target_: concepts.methods.sae.SAEMethod
  hidden_multiplier: 4 # encoder hidden width = min(hidden_multiplier * k, latent dim)
  sparsity_weight: 0.001
  epochs: 50
  min_steps: 5000 # epochs are raised to reach this many optimizer steps (penultimate has 1 row per sample)
  lr: 0.001
  batch_size: 4096
  seed: ${eval.seed}
